version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: coffee-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: coffee-backend
    ports:
      - "5001:5001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/coffee-app
      - PORT=5001
      - JWT_SECRET=your_jwt_secret_key_here
    volumes:
      - ./server:/app
      - ./data:/data
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coffee-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5001/api
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  mongodb_data:
